name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-flight production deploys finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12; we build on 24 (matches local dev)
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # rehype-mermaid's pre-mermaid strategy never launches a browser
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build site (astro + pagefind)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages on first run if the token allows it;
          # otherwise enable manually: Settings -> Pages -> Source: GitHub Actions
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
