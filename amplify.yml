version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 requires Node >= 22.12; we build on 24 (matches local dev)
        - nvm install 24 && nvm use 24
        # rehype-mermaid's pre-mermaid strategy never launches a browser
        - export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: /dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .astro/**/*
